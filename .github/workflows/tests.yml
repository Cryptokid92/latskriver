name: Tester

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Full suite med medfølgende ordliste
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RIM_BM_CACHE: ${{ runner.temp }}/rim-bm
        run: python3 -m unittest discover -s dicts/tester -v
      - name: Evalueringsverktøyet
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RIM_BM_CACHE: ${{ runner.temp }}/rim-bm
        run: python3 -m unittest discover -s eval -v

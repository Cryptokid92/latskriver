name: Tester

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rim-bm
        run: python3 -m unittest discover -s dicts/tester
      - name: Evalueringsverktøyet
        run: python3 -m unittest discover -s eval
